    <main>
        <h1>Conoce nuestros espacios</h1>

        <div class="movil">
            <div id="carouselExample" class="carousel slide">
                
                <!-- imagenes -->
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="../assets/interior2.webp" class="d-block w-100" alt="Un patio de cafeteria">
                    </div>
                    <div class="carousel-item">
                        <img src="../assets/carrusel1.jpg" class="d-block w-100" alt="Un patio de cafeteria con mozos">
                    </div>
                    <div class="carousel-item">
                        <img src="../assets/carrusel2.jpg" class="d-block w-100" alt="Un patio de cafeteria de noche">
                    </div>
                </div>
                <!-- botonera -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <div class="escritorio">
            <section class="galeriagrid">
                <div class="gitem1" data-aos="fade-down" data-aos-duration="1800">
                    <article>
                        <figure class="tarjetafigure" tabindex="0">
                            <img src="../assets/interior1.webp" alt="Un salon de cafeteria">
                            <figcaption>Conoce nuestro salon</figcaption>
                        </figure>
                    </article>
                </div>
                
                <div class="gitem2" data-aos="fade-down" data-aos-duration="1800">
                    <article>
                        <figure class="tarjetafigure" tabindex="0">
                            <img src="../assets/interior2.webp" alt="Un patio de cafeteria">
                            <figcaption>El mejor patio</figcaption>
                        </figure>
                    </article>
                </div>
                
                <div class="gitem3" data-aos="fade-down" data-aos-duration="1800">
                    <article >
                        <figure class="tarjetafigure" tabindex="0">
                            <img src="../assets/interior3.webp" alt="Vista desde el mostrador de nuestra cafeteria">
                            <figcaption>El diseño del interior de nuestra cafeteria</figcaption>
                        </figure>
                    </article>
                </div>
                
                <div class="gitem4" data-aos="fade-up" data-aos-duration="1800">
                    <article>
                        <figure class="tarjetafigure" tabindex="0">
                            <img src="../assets/interior4.webp" alt="Vista general del patio">
                            <figcaption>El mejor lugar para tener una buena merienda</figcaption>
                        </figure>
                    </article>
                </div>
                

            </section>
